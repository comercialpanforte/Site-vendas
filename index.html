<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panforte - Autoatendimento</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header img {
            max-width: 130px;
            height: auto;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 20px;
            margin: 0 0 8px 0;
            color: #1d1d1f;
        }
        .subtitulo {
            font-size: 14px;
            color: #6e6e73;
            line-height: 1.4;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #1d1d1f;
        }
        select {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background-color: #fbfbfd;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            box-sizing: border-box;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236e6e73%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 12px auto;
        }
        select:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
        }
        .btn-pagar {
            width: 100%;
            background-color: #27ae60;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-pagar:hover {
            background-color: #219653;
        }
        .footer-info {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #86868b;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <img src="logo.png" alt="Panforte" onerror="this.style.display='none'">
            <h1>Autoatendimento Panforte</h1>
            <p class="subtitulo">💡 Pegue seu produto no expositor, pague via PIX e bom apetite!</p>
        </div>

        <form id="form-pagamento">
            <div class="form-group">
                <label for="produto">Selecione o produto:</label>
                <select id="produto" name="produto" required>
                    <option value="">Carregando produtos...</option>
                </select>
            </div>

            <button type="submit" class="btn-pagar">Avançar para Pagamento PIX</button>
        </form>

        <div class="footer-info">
            <p>🛠️ Teve algum problema? Fale conosco pelo WhatsApp:<br><strong>(42) 3141-0042</strong></p>
            <p style="margin-top: 8px;">Panforte — Sabor & Qualidade</p>
        </div>
    </div>

    <script>
        // Captura o parâmetro 'local' da URL (ex: ?local=Red_Wolf)
        const urlParams = new URLSearchParams(window.location.search);
        const localURL = urlParams.get('local');

        const selectProduto = document.getElementById('produto');

        async function carregarProdutos() {
            if (!localURL) {
                selectProduto.innerHTML = '<option value="">Ponto de venda não informado na URL</option>';
                return;
            }

            try {
                // Insira aqui a URL do Web App do Google Apps Script
                const response = await fetch('SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI');
                const todosProdutos = await response.json();

                // 1. FILTRO ESTRITO: Apenas os produtos vinculados ao local da URL
                const produtosDoLocal = todosProdutos.filter(item => {
                    const localItem = item.local_id || item.local;
                    return localItem && localItem.trim().toLowerCase() === localURL.trim().toLowerCase();
                });

                renderizarOpcoes(produtosDoLocal);
            } catch (error) {
                console.error("Erro ao carregar produtos:", error);
                selectProduto.innerHTML = '<option value="">Erro ao carregar lista de produtos</option>';
            }
        }

        function renderizarOpcoes(produtos) {
            selectProduto.innerHTML = '<option value="">--- Selecione seu produto ---</option>';

            if (produtos.length === 0) {
                selectProduto.innerHTML = '<option value="">Nenhum produto cadastrado para este local</option>';
                return;
            }

            produtos.forEach(produto => {
                const precoFormatado = parseFloat(produto.preco || produto.valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                
                // FORMATO LIMPO E ENXUTO: Nome do produto e preço (sem texto de estoque)
                const nomeProduto = produto.nome_produto || produto.produto || '';
                const rotulo = `${nomeProduto} — ${precoFormatado}`;

                const option = document.createElement('option');
                option.value = produto.produto_id;
                option.textContent = rotulo;
                option.disabled = false; // Permite a compra mesmo com estoque zero/negativo
                selectProduto.appendChild(option);
            });
        }

        document.addEventListener('DOMContentLoaded', carregarProdutos);
    </script>
</body>
</html>
