<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoatendimento - Pão de Forma High Protein</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #f4f6f8; 
            padding: 20px; 
            color: #333;
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            max-width: 420px; 
            margin: auto; 
        }
        /* Estilo da Logo da Empresa */
        .logo-img {
            max-width: 140px;
            max-height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .produto-img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin: 15px 0;
            background: #eee;
        }
        h2 { margin: 10px 0 5px 0; font-size: 22px; color: #2c3e50; }
        .preco-unitario { color: #7f8c8d; font-size: 15px; margin-bottom: 15px; }
        .contador { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            margin: 20px 0; 
            background: #fdfefe;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #eaecee;
        }
        .btn-qtd { 
            width: 45px;
            height: 45px;
            font-size: 22px; 
            font-weight: bold;
            border: none; 
            background: #eef2f5; 
            color: #2c3e50;
            border-radius: 50%; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .btn-qtd:active { background: #d5dbdb; }
        .total-parcial { font-size: 20px; font-weight: bold; color: #27ae60; margin: 15px 0; }
        .btn-pagar { 
            background: #27ae60; 
            color: white; 
            width: 100%; 
            padding: 14px; 
            font-size: 18px; 
            font-weight: bold; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
            transition: background 0.2s;
        }
        .btn-pagar:hover { background: #219653; }
        .btn-pagar:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }
        
        #area-pix { display: none; margin-top: 25px; padding-top: 20px; border-top: 2px dashed #eaecee; }
        #qr-code-img { width: 210px; height: 210px; margin: 15px auto; display: block; border-radius: 8px; border: 1px solid #ddd; }
        .copia-cola { background: #f8f9f9; padding: 12px; border-radius: 8px; border: 1px solid #d5dbdb; word-break: break-all; font-size: 12px; margin-bottom: 12px; text-align: left; max-height: 80px; overflow-y: auto; }
        .btn-copiar { background: #3498db; color: white; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-copiar:hover { background: #2980b9; }
        .instrucao { font-size: 13px; color: #7f8c8d; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <!-- COLOQUE O LINK DA SUA LOGO NO LUGAR DO LINK ABAIXO -->
        <img src="https://via.placeholder.com/150x50?text=Sua+Logo" alt="Logo da Fábrica" class="logo-img">
        
        <!-- COLOQUE O LINK DA FOTO REAL DO SEU PÃO NO LUGAR DO LINK ABAIXO -->
        <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80" alt="Pão de Forma" class="produto-img">
        
        <h2>Pão de Forma High Protein</h2>
        <div class="preco-unitario">R$ 12,80 cada</div>

        <div class="contador">
            <button class="btn-qtd" onclick="mudarQtd(-1)">-</button>
            <span id="quantidade" style="font-size: 26px; font-weight: bold; min-width: 30px;">1</span>
            <button class="btn-qtd" onclick="mudarQtd(1)">+</button>
        </div>

        <div class="total-parcial" id="total">Total: R$ 12,80</div>

        <button class="btn-pagar" id="btn-comprar" onclick="gerarPix()">Gerar PIX para Pagamento</button>

        <div id="area-pix">
            <h3 style="color: #2c3e50; margin-bottom: 5px;">Escaneie o QR Code</h3>
            <p class="instrucao" style="margin-top: 0;">Abra o aplicativo do seu banco e aponte a câmera</p>
            
            <img id="qr-code-img" src="" alt="QR Code PIX">
            
            <div class="copia-cola" id="texto-copia-cola"></div>
            <button class="btn-copiar" onclick="copiarCodigo()">Copiar Código PIX</button>
        </div>

        <p class="instrucao">💡 Pegue seu produto no expositor, realize o pagamento e bom apetite!</p>
    </div>

    <script>
        let qtd = 1;
        const preco = 12.80;

        function mudarQtd(valor) {
            qtd += valor;
            if (qtd < 1) qtd = 1;
            
            document.getElementById('quantidade').innerText = qtd;
            document.getElementById('total').innerText = 'Total: R$ ' + (qtd * preco).toFixed(2).replace('.', ',');

            document.getElementById('area-pix').style.display = 'none';
            
            const btn = document.getElementById('btn-comprar');
            btn.style.display = 'block';
            btn.disabled = false;
            btn.innerText = 'Gerar PIX para Pagamento';
        }

        async function gerarPix() {
            const btn = document.getElementById('btn-comprar');
            btn.innerText = "Gerando PIX...";
            btn.disabled = true;

            try {
                const response = await fetch('https://site-vendas-cu7g.onrender.com/gerar-pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantidade: qtd })
                });

                const data = await response.json();

                document.getElementById('area-pix').style.display = 'block';
                document.getElementById('qr-code-img').src = 'data:image/jpeg;base64,' + data.qr_code_base64;
                document.getElementById('texto-copia-cola').innerText = data.qr_code_copia_e_cola;
                btn.style.display = 'none';

            } catch (error) {
                alert("Erro ao gerar pagamento. Tente novamente.");
                btn.innerText = "Gerar PIX para Pagamento";
                btn.disabled = false;
            }
        }

        function copiarCodigo() {
            const texto = document.getElementById('texto-copia-cola').innerText;
            navigator.clipboard.writeText(texto);
            alert("Código PIX copiado! Cole no aplicativo do seu banco.");
        }
    </script>

</body>
</html>
