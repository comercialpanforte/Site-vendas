<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoatendimento - Panforte</title>
    <!-- Adicione seus estilos CSS aqui -->
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 120px; margin-bottom: 10px; }
        .badge { background: #e0f2f1; color: #00796b; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        select, input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-add { background: #ff9800; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-pix { background: #4caf50; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .carrinho-lista { text-align: left; max-height: 150px; overflow-y: auto; border: 1px solid #eee; padding: 5px; margin: 10px 0; border-radius: 5px; font-size: 14px; }
        .item-carrinho { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; padding: 5px 0; }
        .btn-remover { background: #ff5252; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo e Local -->
        <img src="logo-panforte.png" alt="Panforte" class="logo" id="logo-img">
        <div class="badge" id="lbl-local">Ponto de venda: Carregando...</div>

        <h3>Selecione os Produtos:</h3>
        
        <!-- Seletor de Produtos (Puxa do backend que fizemos) -->
        <select id="select-produtos">
            <option value="">Carregando produtos...</option>
        </select>

        <!-- Imagem do produto selecionado -->
        <img id="img-produto" src="HighProtein.jpg" alt="Produto" style="width: 100%; height: 150px; object-fit: contain; margin: 10px 0;">

        <!-- Quantidade -->
        <div style="display: flex; gap: 10px; align-items: center;">
            <label for="qtd">Qtd:</label>
            <input type="number" id="input-qtd" value="1" min="1" style="margin: 0;">
            <button class="btn-add" onclick="adicionarAoCarrinho()">Adicionar</button>
        </div>

        <hr>

        <!-- Lista do Carrinho -->
        <h4>Seu Carrinho:</h4>
        <div id="lista-carrinho" class="carrinho-lista">
            <span style="color: #888;">Carrinho vazio</span>
        </div>

        <!-- Total -->
        <h2>Total: R$ <span id="valor-total">0,00</span></h2>

        <!-- Botão Pix -->
        <button class="btn-pix" onclick="gerarPix()">Gerar PIX para Pagamento</button>
        <p style="font-size: 11px; color: #666; margin-top: 10px;">💡 Pegue seu produto no expositor, pague via PIX e bom apetite!</p>
    </div>

    <script>
        let produtosDisponiveis = [];
        let carrinho = [];

        // Pular o nome do Ponto de Venda via URL (?local=Nome)
        const urlParams = new URLSearchParams(window.location.search);
        const local = urlParams.get('local') || 'Geral';
        document.getElementById('lbl-local').innerText = `Ponto de venda: ${local}`;

        // 1. Carregar produtos da API do Render
        async function carregarProdutos() {
            try {
                // Substitua pela URL real do seu backend no Render se mudar
                const resposta = await fetch('https://site-vendas-cu7g.onrender.com/produtos');
                produtosDisponiveis = await resposta.json();

                const select = document.getElementById('select-produtos');
                select.innerHTML = '';

                produtosDisponiveis.forEach((p, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.text = `${p.nome} - R$ ${p.preco.toFixed(2).replace('.', ',')}`;
                    select.appendChild(option);
                });

                atualizarImagemProduto();
            } catch (erro) {
                console.error("Erro ao carregar produtos:", erro);
                alert("Erro ao conectar com o estoque.");
            }
        }

        // Atualizar foto ao trocar o produto no select
        document.getElementById('select-produtos').addEventListener('change', atualizarImagemProduto);

        function atualizarImagemProduto() {
            const index = document.getElementById('select-produtos').value;
            if (produtosDisponiveis[index]) {
                const prod = produtosDisponiveis[index];
                // Se a imagem vier configurada, usa ela, senão padrão
                document.getElementById('img-produto').src = prod.imagem || 'HighProtein.jpg';
            }
        }

        // 2. Adicionar item ao carrinho
        function adicionarAoCarrinho() {
            const indexSelect = document.getElementById('select-produtos').value;
            const quantidade = parseInt(document.getElementById('input-qtd').value) || 1;

            if (indexSelect === "" || !produtosDisponiveis[indexSelect]) return;

            const produtoSelecionado = produtosDisponiveis[indexSelect];

            // Verificar se o produto já está no carrinho para somar a quantidade
            const itemExistente = carrinho.find(item => item.id === produtoSelecionado.id);
            if (itemExistente) {
                itemExistente.quantidade += quantidade;
            } else {
                carrinho.push({
                    id: produtoSelecionado.id,
                    nome: produtoSelecionado.nome,
                    preco: produtoSelecionado.preco,
                    quantidade: quantidade
                });
            }

            renderizarCarrinho();
        }

        // 3. Remover item do carrinho
        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            renderizarCarrinho();
        }

        // 4. Desenhar o carrinho na tela e calcular o total
        function renderizarCarrinho() {
            const divLista = document.getElementById('lista-carrinho');
            const spanTotal = document.getElementById('valor-total');

            if (carrinho.length === 0) {
                divLista.innerHTML = '<span style="color: #888;">Carrinho vazio</span>';
                spanTotal.innerText = '0,00';
                return;
            }

            divLista.innerHTML = '';
            let totalGeral = 0;

            carrinho.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                totalGeral += subtotal;

                const divItem = document.createElement('div');
                divItem.className = 'item-carrinho';
                divItem.innerHTML = `
                    <span>${-item.quantidade}x ${item.nome.substring(0, 18)}...</span>
                    <span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                    <button class="btn-remover" onclick="removerDoCarrinho('${item.id}')">X</button>
                `;
                divLista.appendChild(divItem);
            });

            spanTotal.innerText = totalGeral.toFixed(2).replace('.', ',');
        }

        // 5. Função do Pix (Aqui você envia o array 'carrinho' para o seu backend processar)
        function gerarPix() {
            if (carrinho.length === 0) {
                alert("Adicione pelo menos um produto ao carrinho antes de gerar o Pix!");
                return;
            }

            const total = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            alert(`Gerando Pix no valor total de R$ ${total.toFixed(2).replace('.', ',')} para o ponto: ${local}`);
            
            // Aqui você faria o fetch para a sua rota do backend de pagamento enviando o objeto 'carrinho' e o 'local'.
        }

        // Iniciar carregamento ao abrir a página
        carregarProdutos();
    </script>
</body>
</html>
