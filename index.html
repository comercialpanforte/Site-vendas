<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoatendimento - Panforte</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-sizing: border-box;
        }
        .logo-container {
            margin-bottom: 5px;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo { 
            max-width: 150px; 
            max-height: 60px;
            object-fit: contain;
        }
        .badge { 
            background: #e0f2f1; 
            color: #00796b; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            display: inline-block; 
            margin-bottom: 15px; 
        }
        select, input, button { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        .btn-add { 
            background: #ff9800; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-pix { 
            background: #4caf50; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
        }
        .carrinho-lista { 
            text-align: left; 
            max-height: 150px; 
            overflow-y: auto; 
            border: 1px solid #eee; 
            padding: 8px; 
            margin: 10px 0; 
            border-radius: 5px; 
            background: #fafafa;
        }
        .item-carrinho { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #f0f0f0; 
            padding: 6px 0; 
            gap: 8px;
        }
        .item-carrinho .nome-item {
            flex: 1;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-carrinho .preco-item {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            margin-right: 8px;
        }
        .btn-remover { 
            background: #ff5252; 
            color: white; 
            border: none; 
            width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .footer-assinatura {
            margin-top: 15px;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #f0f0f0;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo -->
        <div class="logo-container">
            <img src="Logo.png" alt="Panforte" class="logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x50?text=Panforte';">
        </div>
        
        <div class="badge" id="lbl-local">📍 Ponto de venda: Carregando...</div>

        <h3 style="margin: 5px 0 10px 0; font-size: 16px;">Selecione o Produto:</h3>
        
        <!-- Seletor de Produtos -->
        <select id="select-produtos">
            <option value="">Carregando produtos...</option>
        </select>

        <!-- Imagem do produto selecionado -->
        <img id="img-produto" src="HighProtein.jpg" alt="Produto" style="width: 100%; height: 140px; object-fit: contain; margin: 5px 0;">

        <!-- Quantidade e Botão Adicionar -->
        <div style="display: flex; gap: 10px; align-items: center;">
            <label for="input-qtd" style="font-size: 14px; font-weight: bold;">Qtd:</label>
            <input type="number" id="input-qtd" value="1" min="1" style="margin: 0; text-align: center;">
            <button class="btn-add" onclick="adicionarAoCarrinho()">Adicionar</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

        <!-- Lista do Carrinho -->
        <h4 style="margin: 0 0 5px 0; font-size: 14px; text-align: left;">Seu Carrinho:</h4>
        <div id="lista-carrinho" class="carrinho-lista">
            <span style="color: #888; font-size: 13px;">Carrinho vazio</span>
        </div>

        <!-- Total -->
        <h2 style="margin: 10px 0; font-size: 20px;">Total: R$ <span id="valor-total">0,00</span></h2>

        <!-- Botão Pix -->
        <button class="btn-pix" onclick="gerarPix()">Gerar PIX para Pagamento</button>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">💡 Pegue seu produto no expositor, pague via PIX e bom apetite!</p>

        <!-- Rodapé / Assinatura -->
        <div class="footer-assinatura">
            Autoatendimento by <strong>Panforte</strong>
        </div>
    </div>

    <script>
        let produtosDisponiveis = [];
        let carrinho = [];

        // Leitura do Ponto de Venda via URL (?local=Nome) com o ícone
        const urlParams = new URLSearchParams(window.location.search);
        const local = urlParams.get('local') || 'Geral';
        document.getElementById('lbl-local').innerHTML = `📍 Ponto de venda: ${local}`;

        // 1. Carregar produtos da API do Render
        async function carregarProdutos() {
            try {
                const resposta = await fetch('https://site-vendas-cu7g.onrender.com/produtos');
                produtosDisponiveis = await resposta.json();

                const select = document.getElementById('select-produtos');
                select.innerHTML = '';

                produtosDisponiveis.forEach((p, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.text = `${p.nome} - R$ ${p.preco.toFixed(2).replace('.', ',')}`;
                    select.appendChild(option);
                });

                atualizarImagemProduto();
            } catch (erro) {
                console.error("Erro ao carregar produtos:", erro);
                alert("Erro ao conectar com o estoque no servidor.");
            }
        }

        // Atualizar foto ao trocar o produto no select
        document.getElementById('select-produtos').addEventListener('change', atualizarImagemProduto);

        function atualizarImagemProduto() {
            const index = document.getElementById('select-produtos').value;
            if (produtosDisponiveis[index]) {
                const prod = produtosDisponiveis[index];
                document.getElementById('img-produto').src = prod.imagem || 'HighProtein.jpg';
            }
        }

        // 2. Adicionar item ao carrinho e resetar quantidade para 1
        function adicionarAoCarrinho() {
            const indexSelect = document.getElementById('select-produtos').value;
            const inputQtd = document.getElementById('input-qtd');
            const quantidade = parseInt(inputQtd.value) || 1;

            if (indexSelect === "" || !produtosDisponiveis[indexSelect]) return;

            const produtoSelecionado = produtosDisponiveis[indexSelect];

            const itemExistente = carrinho.find(item => item.id === produtoSelecionado.id);
            if (itemExistente) {
                itemExistente.quantidade += quantidade;
            } else {
                carrinho.push({
                    id: produtoSelecionado.id,
                    nome: produtoSelecionado.nome,
                    preco: produtoSelecionado.preco,
                    quantidade: quantidade
                });
            }

            renderizarCarrinho();

            // Reseta o campo de quantidade para 1 após adicionar
            inputQtd.value = 1;
        }

        // 3. Remover item do carrinho
        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            renderizarCarrinho();
        }

        // 4. Desenhar o carrinho na tela e calcular o total
        function renderizarCarrinho() {
            const divLista = document.getElementById('lista-carrinho');
            const spanTotal = document.getElementById('valor-total');

            if (carrinho.length === 0) {
                divLista.innerHTML = '<span style="color: #888; font-size: 13px;">Carrinho vazio</span>';
                spanTotal.innerText = '0,00';
                return;
            }

            divLista.innerHTML = '';
            let totalGeral = 0;

            carrinho.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                totalGeral += subtotal;

                const divItem = document.createElement('div');
                divItem.className = 'item-carrinho';
                divItem.innerHTML = `
                    <span class="nome-item">${item.quantidade}x ${item.nome}</span>
                    <span class="preco-item">R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                    <button class="btn-remover" onclick="removerDoCarrinho('${item.id}')" title="Remover item">✕</button>
                `;
                divLista.appendChild(divItem);
            });

            spanTotal.innerText = totalGeral.toFixed(2).replace('.', ',');
        }

        // 5. Função de fechar pedido e gerar Pix
        function gerarPix() {
            if (carrinho.length === 0) {
                alert("Adicione pelo menos um produto ao carrinho antes de prosseguir!");
                return;
            }

            const total = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            
            console.log("Enviando carrinho para pagamento:", { local, carrinho, total });
            alert(`Carrinho validado! Total de R$ ${total.toFixed(2).replace('.', ',')} para o Ponto de venda: ${local}. Pronto para integrar com o gateway de Pix.`);
        }

        // Iniciar carregamento ao abrir a página
        carregarProdutos();
    </script>
</body>
</html>
